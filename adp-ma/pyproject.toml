[project]
name = "adp-ma"
version = "0.1.0"
description = "Autonomous Data Processing using Meta-Agents (arXiv:2602.00307) 모사 구현"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.35",
    "typer>=0.12",
    "rich>=13.7",
    "minio>=7.2",
    "pyarrow>=16.0",
    "kubernetes>=29.0",
]

[project.scripts]
adp-ma = "adp_ma.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adp_ma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
