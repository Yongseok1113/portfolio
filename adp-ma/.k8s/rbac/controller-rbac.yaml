# adp-ma controller가 adp-ma-workers ns에 ground agent Job을 만들 권한.
# 로컬 CLI 디스패치는 kubeconfig를 쓰므로 불필요 — 클러스터 내 controller 배포용.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adp-ma-controller
  namespace: adp-ma-system
  labels:
    app: adp-ma
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adp-ma-job-manager
  namespace: adp-ma-workers
  labels:
    app: adp-ma
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adp-ma-controller-job-manager
  namespace: adp-ma-workers
  labels:
    app: adp-ma
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adp-ma-job-manager
subjects:
  - kind: ServiceAccount
    name: adp-ma-controller
    namespace: adp-ma-system
